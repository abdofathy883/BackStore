<section class="container py-4">
  <div class="card">
    <div class="card-header">
      <h2>اضافة منتج جديد</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="title" class="form-label">اسم المنتج</label>
          <input
            type="text"
            class="form-control"
            id="title"
            formControlName="title"
          />
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">وصف المنتج</label>
          <textarea
            id="description"
            class="form-control"
            rows="3"
            formControlName="description"
          ></textarea>
        </div>

        <!-- category -->
        <div class="row mb-3">
          <div class="col">
            <label for="categoryId" class="form-label">فئة المنتج</label>
            <select
              id="categoryId"
              class="form-select"
              formControlName="categoryId"
            >
              <option disabled selected>اختر فئة</option>
              @for (category of categories; track $index) {
                <option [value]="category.id">{{ category.title }}</option>
              }
            </select>
          </div>
        </div>

        <div formArrayName="productVariants">
          @for (
            item of productVariantArray.controls;
            track $index;
            let vi = $index
          ) {
            <div [formGroupName]="vi" class="border rounded p-3 mb-3">
              <h6>المنتج #{{ vi + 1 }}</h6>
              <button
                type="button"
                class="btn btn-outline-danger btn-sm mb-3"
                (click)="removeProductVariant(vi)"
              >
                - إزالة المنتج
              </button>

              <!-- Dropzone: each variant gets a unique id -->
              <div class="mb-3">
                <label class="form-label">صورة المنتج</label>
                <div [id]="'dropzone-' + vi" class="dropzone"></div>
              </div>

              <div class="mb-3">
                <label for="imageAltText" class="form-label">النص البديل للصورة</label>
                <input
                  type="text"
                  id="imageAltText"
                  class="form-control"
                  formControlName="imageAltText"
                />
              </div>

              <div class="row">
                <div class="col-12 col-md-6 mb-3">
                  <label for="colorId" class="form-label">اللون</label>
                  <select
                    id="colorId"
                    class="form-select"
                    formControlName="colorId"
                  >
                    <option disabled selected value="">اختر لوناً</option>
                    @for (item of colors; track $index) {
                      <option [value]="item.id">{{ item.name }}</option>
                    }
                  </select>
                </div>
                <div class="col-12 col-md-6 mb-3">
                  <label for="sizeId" class="form-label">المقاس</label>
                  <select
                    id="sizeId"
                    class="form-select"
                    formControlName="sizeId"
                  >
                    <option disabled selected value="">اختر مقاساً</option>
                    @for (item of sizes; track $index) {
                      <option [value]="item.id">{{ item.name }}</option>
                    }
                  </select>
                </div>
              </div>

              <div class="row">
                <div class="col-12 col-md-6 mb-3">
                  <label for="originalPrice" class="form-label">السعر الاصلي</label>
                  <input
                    type="number"
                    id="originalPrice"
                    class="form-control"
                    min="0"
                    step="50"
                    formControlName="originalPrice"
                  />
                </div>
                <div class="col-12 col-md-6 mb-3">
                  <label for="salePrice" class="form-label">السعر بعد التخفيض</label>
                  <input
                    type="number"
                    id="salePrice"
                    class="form-control"
                    min="0"
                    step="50"
                    formControlName="salePrice"
                  />
                </div>
              </div>

              <div class="row">
                <div class="col-12 col-md-6 mb-3">
                  <label for="wholesalePrice" class="form-label">wholesale</label>
                  <input
                    type="number"
                    id="wholesalePrice"
                    class="form-control"
                    step="50"
                    min="0"
                    formControlName="wholesalePrice"
                  />
                </div>
                <div class="col-12 col-md-6 mb-3">
                  <label for="stock" class="form-label">المخزون</label>
                  <input
                    type="number"
                    id="stock"
                    class="form-control"
                    step="50"
                    min="0"
                    formControlName="stock"
                  />
                </div>
              </div>

              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="isFeatured"
                  formControlName="isFeatured"
                />
                <label class="form-check-label" for="isFeatured">المميزة</label>
              </div>
            </div>
          }
        </div>

        <button
          type="button"
          class="btn btn-outline-success btn-sm mb-2"
          (click)="addProductVariant()"
        >
          + إضافة متغير
        </button>

        <button class="form-button" style="width: 100%" type="submit">
          @if (isLoading) {
            <span
              class="spinner-border spinner-border-sm"
              role="status"
              aria-hidden="true"
            ></span>
            جاري الإضافة...
          } @else {
            اضافة منتج
          }
        </button>
      </form>
    </div>
  </div>
</section>

<!-- Hidden Dropzone preview template — shared across all dropzones -->
<div id="preview-template" style="display: none">
  <div class="dz-preview dz-file-preview">
    <img data-dz-thumbnail />
    <div class="dz-details">
      <div data-dz-name></div>
      <div data-dz-size></div>
    </div>
    <div class="dz-progress">
      <span class="dz-upload" data-dz-uploadprogress></span>
    </div>
    <div class="dz-error-message">
      <span data-dz-errormessage></span>
    </div>
  </div>
</div>
