<section class="container py-4">
  <div class="card">
    <div class="card-header">
      <h2>معلومات التصنيف</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="title" class="form-label">اسم الفئة</label>
          <input
            type="text"
            class="form-control"
            id="title"
            name="title"
            formControlName="title"
            required
          />
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">وصف الفئة</label>
          <textarea
            name="description"
            id="description"
            class="form-control"
            formControlName="description"
            rows="3"
          ></textarea>
        </div>

        <div class="mb-3">
          <label for="categoryImage" class="form-label"> صورة الفئة</label>
          <div id="dropzone-area" class="dropzone"></div>
          <!-- Custom preview template -->
          <div id="preview-template" style="display: none">
            <div class="dz-preview dz-file-preview">
              <img data-dz-thumbnail />
              <div class="dz-details">
                <div data-dz-name></div>
                <div data-dz-size></div>
              </div>
              <div class="dz-progress">
                <span class="dz-upload" data-dz-uploadprogress></span>
              </div>

              <div class="dz-error-message">
                <span data-dz-errormessage></span>
              </div>
            </div>
          </div>
        </div>

        <button class="form-button">
          @if (isLoading) {
            <span
              class="spinner-border spinner-border-sm"
              role="status"
              aria-hidden="true"
            ></span>
            جاري التحديث...
          } @else {
            تحديث البيانات
          }
        </button>
      </form>
    </div>
  </div>
</section>

@if (category) {
  <section class="container mt-5 d-flex gap-3">
    @if (category.isDeleted == false) {
      <button class="btn btn-outline-danger" (click)="toggleVisibility()">
        اخفاء التصنيف من المتجر
      </button>
    }
    @if (category.isDeleted) {
      <button class="btn btn-outline-danger" (click)="toggleVisibility()">
        اظهار التصنيف من المتجر
      </button>
    }
    <button class="btn btn-danger" (click)="deleteCategory()">
      حذف التصنيف نهائي من المتجر
    </button>
  </section>
}
